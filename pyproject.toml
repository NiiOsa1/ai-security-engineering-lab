[project]
name = "ai-security-engineering-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security_lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
